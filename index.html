<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aether — Cloud Expert</title>
  <meta name="description" content="Aether cloud storage: fast, secure and the most affordable storage plans in the market.">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/png" href="assets/aether-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="intro-on">

  <!-- ───────── Cinematic intro ───────── -->
  <div id="intro" class="intro" aria-hidden="true">
    <canvas id="intro-canvas"></canvas>
    <div class="intro-glow"></div>
    <div class="intro-stage">
      <img src="assets/aether-logo.png" class="intro-logo" alt="">
      <p class="intro-tag">Storage, without the weight.</p>
      <div class="intro-bar"><span></span></div>
    </div>
    <button class="intro-skip" type="button">Skip intro</button>
  </div>

  <!-- Ambient background -->
  <div class="bg-fx" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span>
    <div class="grid"></div>
  </div>

  <!-- ───────── Auth (Page A) ───────── -->
  <div id="auth-root" hidden></div>

  <!-- ───────── App shell (Pages B & C) ───────── -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <a href="#/dashboard" class="brand" aria-label="Aether home">
        <img src="assets/aether-logo.png" alt="Aether — Cloud Expert" class="brand-logo">
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <div class="side-foot">
        <label class="tester spot" for="tester-toggle">
          <span class="tester-text">
            <strong>Test tier</strong>
            <small>Unlimited free storage</small>
          </span>
          <input type="checkbox" id="tester-toggle" class="switch-input">
          <span class="switch" aria-hidden="true"><span></span></span>
        </label>
        <div id="plan-chip" class="plan-chip"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a href="#/dashboard" class="top-logo" aria-label="Aether home"><img src="assets/aether-icon.png" alt=""></a>
        <div class="top-title">
          <p class="crumb">Aether <span>/</span> <span id="crumb"></span></p>
          <h1 id="page-title"></h1>
        </div>
        <div class="top-actions">
          <span id="tester-badge" class="badge-test" hidden><i></i>Test tier · Unlimited</span>
          <div class="user" id="user-menu"></div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <!-- Core -->
  <script src="js/config.js"></script>
  <script src="js/services.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <!-- Views -->
  <script src="js/views/auth.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/files.js"></script>
  <script src="js/views/transactions.js"></script>
  <script src="js/views/pricing.js"></script>
  <script src="js/views/why.js"></script>
  <!-- Router + boot -->
  <script src="js/app.js"></script>
</body>
</html>
